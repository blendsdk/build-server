# Example runner fleet — replace these organizations with your own.
#
# Format: <name> [key=value ...]
#   url=<https base>   GitHub or GitHub Enterprise base URL for the organization
#                      (default https://github.com/<name>)
#   context=<dir>      directory containing a custom runner-image Dockerfile
#                      (default: the standard runner-image)
#   build_temp=1       mount the host /tmp at /build-temp for this runner
#   deploy_ssh=<dir>   folder with deploy SSH material (config, known_hosts, keys/)
#                      mounted read-only into the runner; must live under deploy-ssh/
#
# Add or remove an organization by editing this file, then run `./fleet.sh up`
# (use `./fleet.sh restart` to also remove containers of deleted organizations).

AcmeTools
Globex build_temp=1
Initech context=examples/runner-custom
Contoso url=https://ghe.example.com/Contoso
